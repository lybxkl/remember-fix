version: '3'

info:
  companyName: "RememberFix"
  productName: "记得修"
  productIdentifier: "com.rememberfix.desktop"
  description: "截屏记录 Bug，看板管理，AI 自动分类"
  copyright: "© 2026 RememberFix"
  comments: "Remember-Fix desktop app"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: info
  debounce: 800
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - .wails-template
      - .zcode
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
      - "*.log"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
